<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match Charts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="controls">
    <div class="ctl-summary">
      <span id="ctlSummary"></span>
      <button type="button" id="ctlChange">Change</button>
    </div>
    <form id="controls" autocomplete="off">
      <label>League
        <select id="league" name="league"></select>
      </label>
      <label><span id="roundWord">Round</span>
        <select id="round" name="round" disabled></select>
      </label>
      <label>History round
        <select id="historyRound" name="historyRound">
          <option value="">Same as round</option>
        </select>
      </label>
      <label>Data
        <select id="data" name="data">
          <option value="auto">Auto (refresh stale data)</option>
          <option value="cache">Cached only (no refresh)</option>
          <option value="fresh">Fresh (re-pull every source)</option>
        </select>
      </label>
      <button type="submit" id="build">Build chart</button>
      <span id="status" role="status" aria-live="polite"></span>
    </form>
  </header>

  <main>
    <div id="error" class="error" role="alert" hidden></div>
    <div class="filter-row">
      <label id="filterBox" class="filter" hidden>Filter teams
        <input type="search" id="filter" placeholder="e.g. Brazil" autocomplete="off">
      </label>
      <button type="button" id="fitBtn" class="fit-btn" hidden aria-pressed="true" title="Shrink the table so the whole round fits without scrolling down">Fit to screen</button>
    </div>
    <p id="branchHint" class="branch-hint" hidden></p>
    <section id="chart" class="chart" hidden></section>
    <details id="log" class="log" hidden>
      <summary>Run log</summary>
      <div id="logBody"></div>
    </details>
  </main>

  <script src="app.js"></script>
</body>
</html>
